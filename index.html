<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#EAF3E6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="今天吃点啥">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>今天吃点啥</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    background: #F2F4EF;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    color: #1F2328;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior-y: contain;
  }

  /* ---------- 顶部 ---------- */
  .hero {
    padding: 26px 20px 18px;
    background: linear-gradient(165deg, #EAF3E6 0%, #F2F4EF 100%);
  }
  .date {
    font-size: 13px;
    color: #6B7A6B;
    letter-spacing: .4px;
  }
  .hero h1 {
    margin-top: 8px;
    font-size: 25px;
    font-weight: 700;
    color: #1B3A1F;
    line-height: 1.28;
    letter-spacing: -.2px;
  }
  .sub {
    margin-top: 7px;
    font-size: 14px;
    color: #6B7A6B;
  }
  /* ---------- 不知道吃啥：一键配一桌 ---------- */
  .pick {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    width: 100%;
    margin-top: 14px;
    padding: 13px 16px;
    border: 0;
    border-radius: 14px;
    background: #2E7D32;
    color: #fff;
    font-family: inherit;
    font-size: 16.5px;
    font-weight: 700;
    letter-spacing: .3px;
    box-shadow: 0 5px 16px rgba(46, 125, 50, .26);
    cursor: pointer;
    transition: transform .12s, background .16s;
  }
  .pick:active { transform: scale(.985); background: #276B2A; }
  .pick svg { width: 21px; height: 21px; flex: none; }

  /* ---------- 配一桌的结果 ---------- */
  .pair-note {
    margin: 2px 0 11px;
    padding: 11px 13px;
    background: #F4F8F1;
    border-radius: 11px;
    font-size: 13.5px;
    color: #4A5159;
    line-height: 1.68;
  }
  #pairSheet .sheet-head {
    flex-direction: column;
    align-items: flex-start;
    gap: 3px;
  }
  .pair-row {
    display: grid;
    grid-template-columns: 64px minmax(0, 1fr);
    column-gap: 11px;
    align-items: center;
    padding: 9px 10px;
    background: #fff;
    border: 1px solid #E6EDE2;
    border-radius: 12px;
    margin-bottom: 8px;
  }
  .pair-img {
    width: 64px;
    height: 64px;
    border-radius: 9px;
    object-fit: cover;
    display: block;
    background: #F1F5EE;
  }
  .pair-n { font-size: 16px; font-weight: 700; color: #1F2328; line-height: 1.35; }
  .pair-n .pair-lv { font-size: 11.5px; font-weight: 600; margin-left: 6px; }
  .pair-lv.lv1 { color: #2E7D32; }
  .pair-lv.lv2 { color: #B07A18; }
  .pair-meta { margin-top: 4px; font-size: 12.5px; color: #7C8A7C; }
  .pair-tag {
    display: inline-block;
    margin-right: 6px;
    padding: 1px 7px;
    border-radius: 5px;
    font-size: 11.5px;
    font-weight: 600;
    background: #EEF4EA;
    color: #2E7D32;
  }
  .pair-tag.t-soup { background: #EAF1F6; color: #33607D; }
  .pair-tag.t-veg  { background: #F0F4E4; color: #5C7024; }
  .pair-tag.t-egg  { background: #FBF3E2; color: #8A6415; }

  /* ---------- 分组标题 ---------- */
  .group {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 20px 8px 10px;
  }
  .group:first-child { padding-top: 6px; }
  .group-name {
    font-size: 17px;
    font-weight: 700;
    color: #1B3A1F;
    letter-spacing: .3px;
  }
  .group-name::before {
    content: "";
    display: inline-block;
    width: 3px;
    height: 15px;
    border-radius: 2px;
    background: #A5C9A0;
    margin-right: 8px;
    vertical-align: -1px;
  }
  .group-count {
    font-size: 12.5px;
    color: #94A094;
  }


  /* ---------- 一级页：单列大图卡（只放图 + 菜名）---------- */
  .grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 11px;
  }
  .tile {
    position: relative;
    display: block;
    width: 100%;
    padding: 0;
    border: 0;
    background: #fff;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 1px 7px rgba(27, 58, 31, .07);
    cursor: pointer;
    font-family: inherit;
    text-align: left;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    transition: transform .14s;
  }
  .tile:active { transform: scale(.977); }
  .tile-fig {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    background: #EDEFE9;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    line-height: 1;
    overflow: hidden;
  }
  .tile-fig img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .tile-n {
    padding: 9px 11px 11px;
    font-size: 15px;
    font-weight: 600;
    color: #1B3A1F;
    line-height: 1.34;
  }
  /* 图片左上角的等级色点：不占文字位，一眼看出哪道要留意 */
  .tile-dot {
    position: absolute;
    left: 9px;
    top: 9px;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    box-shadow: 0 0 0 2.5px rgba(255, 255, 255, .85);
  }
  .tile-dot.d1 { background: #2E9E4F; }
  .tile-dot.d2 { background: #E0A11B; }
  .tile-dot.d3 { background: #C4553F; }
  .tile-add {
    position: absolute;
    right: 8px;
    bottom: 8px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 0;
    background: rgba(255, 255, 255, .94);
    color: #2E7D32;
    font-size: 25px;
    font-weight: 400;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .16);
    cursor: pointer;
    font-family: inherit;
    transition: background .16s, color .16s, transform .14s;
  }
  .tile-add:active { transform: scale(.9); }
  .tile.on .tile-add {
    background: #2E7D32;
    color: #fff;
    font-size: 20px;
    font-weight: 700;
  }
  .tile.on .tile-fig::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(46, 125, 50, .13);
    pointer-events: none;
  }

  /* ---------- 二级页：详情 ---------- */
  .dt {
    position: fixed;
    inset: 0;
    z-index: 80;
    background: #F2F4EF;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    transform: translateX(100%);
    transition: transform .27s cubic-bezier(.32, .72, 0, 1);
    visibility: hidden;
  }
  .dt.on { transform: none; visibility: visible; }
  .dt-top {
    position: sticky;
    top: 0;
    z-index: 3;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: calc(9px + env(safe-area-inset-top)) 14px 9px;
    background: rgba(242, 244, 239, .93);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
  }
  .dt-back {
    flex: none;
    width: 40px;
    height: 40px;
    border: 0;
    border-radius: 50%;
    background: #fff;
    color: #1B3A1F;
    font-size: 21px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 1px 5px rgba(27, 58, 31, .10);
    cursor: pointer;
    font-family: inherit;
  }
  .dt-back:active { transform: scale(.92); }
  .dt-crumb {
    font-size: 13.5px;
    color: #7A857A;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .dt-fig {
    position: relative;
    margin: 4px 14px 0;
    border-radius: 16px;
    overflow: hidden;
    aspect-ratio: 1 / 1;
    background: #EDEFE9;
  }
  .dt-fig img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .dt-body { padding: 15px 16px 22px; }
  .dt-name {
    font-size: 23px;
    font-weight: 700;
    color: #1B3A1F;
    line-height: 1.28;
    letter-spacing: -.2px;
  }
  .dt-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 9px;
    flex-wrap: wrap;
  }
  .dt-cat {
    font-size: 12.5px;
    color: #7A857A;
    padding: 3px 9px;
    border-radius: 999px;
    background: #E8ECE4;
  }
  .dt-sec { margin-top: 19px; }
  .dt-h {
    font-size: 12.5px;
    font-weight: 700;
    color: #2E7D32;
    letter-spacing: .1em;
  }
  .dt-p {
    margin-top: 7px;
    font-size: 15.5px;
    line-height: 1.78;
    color: #3D443D;
  }
  .dt-foot {
    position: sticky;
    bottom: 0;
    padding: 14px 16px calc(16px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, #F2F4EF 62%, rgba(242, 244, 239, 0));
  }
  .dt-btn {
    width: 100%;
    padding: 15px 16px;
    border: 0;
    border-radius: 14px;
    background: #2E7D32;
    color: #fff;
    font-family: inherit;
    font-size: 16.5px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(46, 125, 50, .28);
  }
  .dt-btn:active { transform: scale(.985); }
  .dt-btn.on {
    background: #fff;
    color: #2E7D32;
    box-shadow: inset 0 0 0 2px #2E7D32;
  }

  /* ---------- 两栏骨架：左边分类竖条，右边菜品 ---------- */
  .shell {
    display: grid;
    grid-template-columns: 88px minmax(0, 1fr);
    column-gap: 9px;
    padding: 0 12px 0 10px;
    align-items: start;
  }
  .col { min-width: 0; }

  /* ---------- 分类（左侧竖条，吸顶）---------- */
  .cats {
    display: flex;
    flex-direction: column;
    gap: 5px;
    padding: 8px 0 12px;
    position: sticky;
    top: 0;
    max-height: 100vh;
    max-height: 100dvh;
    overflow-y: auto;
    scrollbar-width: none;
    background: #F2F4EF;
    -webkit-overflow-scrolling: touch;
  }
  .cats::-webkit-scrollbar { display: none; }
  .cat {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 6px;
    min-height: 40px;
    border-radius: 9px;
    background: #fff;
    color: #4A5159;
    font-family: inherit;
    font-size: 14px;
    line-height: 1.18;
    letter-spacing: -.2px;
    text-align: center;
    border: 1px solid #E4E8E0;
    cursor: pointer;
    transition: background .15s, color .15s;
    white-space: normal;
    word-break: keep-all;
  }
  .cat:active { transform: scale(.96); }
  .cat.on {
    background: #2E7D32;
    color: #fff;
    border-color: #2E7D32;
    font-weight: 600;
  }
  /* 非菜品的三个标签：暖色，一眼区分开 */
  .cat.cat-x {
    background: #FFF9F0;
    border-color: #F0DEBE;
    color: #A2660A;
  }
  .cat.cat-x.on {
    background: #C98A1E;
    border-color: #C98A1E;
    color: #fff;
  }
  .x-lead {
    margin: 2px 4px 14px;
    padding: 14px 15px;
    background: #FFF9F0;
    border: 1px solid #F2E4CB;
    border-radius: 14px;
    font-size: 15px;
    line-height: 1.7;
    color: #7A5410;
  }

  /* ---------- 图例 ---------- */
  .legend {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 2px 0 10px;
  }
  .lg {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    color: #6B7A6B;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .d1 { background: #43A047; }
  .d2 { background: #EFB23E; }

  .legend-btn {
    margin-left: auto;
    flex: none;
    padding: 5px 12px;
    border-radius: 999px;
    border: 1px solid #D8E0D2;
    background: #fff;
    color: #2E7D32;
    font-size: 12.5px;
    font-family: inherit;
    cursor: pointer;
    white-space: nowrap;
  }
  .legend-btn:active { background: #F1F6EE; }

  /* ---------- 列表 ---------- */
  .list {
    padding: 0;
    padding-bottom: 130px;
  }

  .card {
    display: grid;
    grid-template-columns: 108px minmax(0, 1fr);
    column-gap: 12px;
    align-items: start;
    background: #fff;
    border-radius: 15px;
    padding: 14px 13px;
    margin-bottom: 10px;
    border: 1.5px solid transparent;
    box-shadow: 0 1px 6px rgba(27, 58, 31, .05);
    cursor: pointer;
    transition: border-color .16s, background .16s, box-shadow .16s;
    position: relative;
  }
  .card.on {
    border-color: #2E7D32;
    background: #F7FBF4;
    box-shadow: 0 2px 12px rgba(46, 125, 50, .15);
  }

  .thumb {
    flex: none;
    grid-column: 1;
    grid-row: 1;
    align-self: stretch;
    width: 108px;
    min-height: 108px;
    height: auto;
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-right: 12px;
    font-size: 32px;
    line-height: 1;
    position: relative;
  }
  .thumb img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .t1 { background: #E8F5E9; }
  .t2 { background: #FFF6E0; }

  .body { grid-column: 2; grid-row: 1; min-width: 0; padding-right: 34px; }

  .row1 {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 7px;
    margin-bottom: 5px;
  }
  .name {
    font-size: 19px;
    font-weight: 700;
    color: #1F2328;
    line-height: 1.3;
  }
  .badge {
    padding: 2px 8px;
    border-radius: 5px;
    font-size: 11.5px;
    line-height: 1.6;
    flex: none;
  }
  .b1 { background: #E8F5E9; color: #2E7D32; }
  .b2 { background: #FFF6E0; color: #A96A00; }

  .why {
    font-size: 15px;
    color: #4A5159;
    line-height: 1.62;
  }
  .tip {
    grid-column: 1 / -1;
    grid-row: 2;
    margin-top: 9px;
    font-size: 13.5px;
    color: #7C8A7C;
    line-height: 1.6;
  }
  .tip::before { content: "做法："; }

  .tick {
    position: absolute;
    right: 13px;
    top: 16px;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: #F1F3EE;
    color: #9AA69A;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .16s, color .16s;
  }
  .tick.on { background: #2E7D32; color: #fff; }

  /* ---------- 底部条 ---------- */
  .bar {
    position: fixed;
    left: 12px;
    right: 12px;
    bottom: calc(12px + env(safe-area-inset-bottom));
    display: flex;
    align-items: center;
    background: #fff;
    border-radius: 15px;
    padding: 10px 10px 10px 16px;
    box-shadow: 0 8px 30px rgba(27, 58, 31, .18);
    transform: translateY(150%);
    opacity: 0;
    transition: transform .28s cubic-bezier(.2, .8, .3, 1), opacity .2s;
    z-index: 50;
  }
  .bar.on { transform: translateY(0); opacity: 1; }
  .bar-num { display: flex; align-items: baseline; margin-right: 13px; }
  .bar-count { font-size: 24px; font-weight: 700; color: #2E7D32; line-height: 1; }
  .bar-unit { font-size: 13.5px; color: #6B7A6B; margin-left: 3px; }
  .bar-btn {
    flex: 1;
    height: 48px;
    border-radius: 11px;
    background: #2E7D32;
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border: none;
    font-family: inherit;
  }
  .bar-btn:active { background: #256428; }

  /* ---------- 面板 ---------- */
  .mask {
    position: fixed;
    inset: 0;
    background: rgba(20, 30, 20, .45);
    opacity: 0;
    visibility: hidden;
    transition: opacity .22s;
    z-index: 60;
  }
  .mask.on { opacity: 1; visibility: visible; }

  .sheet {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    max-height: 86vh;
    max-height: 86dvh;
    background: #fff;
    border-radius: 20px 20px 0 0;
    transform: translateY(102%);
    transition: transform .3s cubic-bezier(.2, .8, .3, 1);
    z-index: 70;
    display: flex;
    flex-direction: column;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .sheet.on { transform: translateY(0); }
  .bar-handle {
    width: 38px;
    height: 4px;
    border-radius: 999px;
    background: #DFE4DA;
    margin: 9px auto 3px;
    flex: none;
  }
  .sheet-head {
    padding: 9px 20px 10px;
    display: flex;
    align-items: baseline;
    gap: 9px;
    flex: none;
  }
  .sheet-title { font-size: 21px; font-weight: 700; color: #1F2328; }
  .sheet-sub { font-size: 13.5px; color: #7C8A7C; }
  .sheet-body {
    flex: 1;
    overflow-y: auto;
    padding: 0 16px 6px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .sheet-body::-webkit-scrollbar { display: none; }

  .adv {
    display: flex;
    align-items: flex-start;
    padding: 12px;
    border-radius: 11px;
    margin-bottom: 8px;
  }
  .aok { background: #F1F8EE; }
  .awarn { background: #FFF8E6; }
  .abad { background: #FDF0EE; }
  .adv-icon {
    flex: none;
    width: 21px;
    height: 21px;
    border-radius: 50%;
    font-size: 12.5px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-right: 9px;
    color: #fff;
    font-weight: 700;
  }
  .aok .adv-icon { background: #43A047; }
  .awarn .adv-icon { background: #EFB23E; }
  .abad .adv-icon { background: #E2584A; }
  .adv-text { flex: 1; font-size: 14.5px; color: #33383D; line-height: 1.62; }

  .tips {
    margin: 8px 0 14px;
    padding: 14px;
    background: #F7F8F5;
    border-radius: 11px;
  }
  .tips-title {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #6B7A6B;
    margin-bottom: 9px;
  }
  .tips-row {
    display: flex;
    align-items: flex-start;
    margin-bottom: 6px;
    font-size: 13.5px;
    color: #555E55;
    line-height: 1.58;
  }
  .tips-row:last-child { margin-bottom: 0; }
  .tips-dot {
    flex: none;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #B9C4B6;
    margin: 8px 8px 0 0;
  }

  .sheet-foot {
    display: flex;
    gap: 10px;
    padding: 10px 16px 18px;
    flex: none;
  }
  .btn {
    height: 50px;
    border-radius: 11px;
    font-size: 16px;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border: none;
  }
  .btn-ghost {
    flex: 1;
    border: 1px solid #DFE4DA;
    background: #fff;
    color: #6B7A6B;
    font-size: 15px;
  }
  .btn-main {
    flex: 1.7;
    background: #2E7D32;
    color: #fff;
    font-weight: 600;
  }
  .btn-main:active { background: #256428; }

  /* ---------- 建议页 ---------- */
  .sec {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 22px 2px 11px;
  }
  .sec:first-child { padding-top: 4px; }
  .sec-t {
    font-size: 17px;
    font-weight: 700;
    color: #1B3A1F;
  }
  .sec-t::before {
    content: "";
    display: inline-block;
    width: 3px;
    height: 15px;
    border-radius: 2px;
    background: #A5C9A0;
    margin-right: 8px;

  }

  /* ============================================================
     手机适配
     手机型号屏幕尺寸差别很大（320 的老安卓到 430 的大屏），
     这里处理四件事：刘海挡住内容、手指点不中、小屏挤断行、
     平板/电脑上被拉成一条长带。
     ============================================================ */

  /* 1. 基础：不要固定高度，横竖屏都不出横向滚动条
        注意：这里必须用 clip 不能用 hidden —— hidden 会让 body 变成滚动容器，
        左侧分类条的 position:sticky 就失效了（会跟着页面一起滚走）。
        老浏览器不认 clip 时退回 hidden，只是吸顶失效，别的不受影响。 */
  html, body {
    height: auto;
    min-height: 100%;
    overflow-x: hidden;
    overflow-x: clip;
  }

  /* 2. 去掉双击缩放的 300ms 等待，点一下就有反应，手感跟原生一样 */
  * { touch-action: manipulation; }

  button {
    font-family: inherit;
    -webkit-appearance: none;
    appearance: none;
  }

  /* 3. 刘海屏 / 状态栏：内容不能钻到听筒下面去 */
  .hero {
    padding-top: calc(26px + env(safe-area-inset-top));
  }

  /* 4. 底部条抬高一点：iOS Safari 底部工具栏会盖住 12px 那一档 */
  .bar { bottom: calc(16px + env(safe-area-inset-bottom)); }
  .list { padding-bottom: 140px; }

  /* 5. 点按不要选中文字、不要弹出"拷贝/查词典"菜单 */
  .card, .cat, .btn, .bar-btn, .tick, .thumb {
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  /* 6. 手指点得中：标签至少 42px 高（手指接触面约 9mm） */
  .tick { min-width: 32px; min-height: 32px; }

  /* 7. 宽屏（平板、电脑预览）：居中成一条手机宽度，别拉成一条长带 */
  @media (min-width: 620px) {
    body {
      max-width: 560px;
      margin: 0 auto;
      background: #F2F4EF;
      box-shadow: 0 0 0 1px #E4E8E0, 0 0 44px rgba(27, 58, 31, .07);
    }
    .bar {
      left: 50%;
      right: auto;
      width: 536px;
      transform: translate(-50%, 150%);
    }
    .bar.on { transform: translate(-50%, 0); }
    .sheet {
      left: 50%;
      right: auto;
      width: 560px;
      transform: translate(-50%, 102%);
    }
    .sheet.on { transform: translate(-50%, 0); }
    .mask {
      left: 50%;
      right: auto;
      width: 560px;
      transform: translateX(-50%);
    }
  }

  /* 8. 小屏（320–360，老安卓和 iPhone SE）：压留白、缩字号，别让字挤成两行 */
  @media (max-width: 344px) {
    .hero { padding-left: 16px; padding-right: 16px; }
    .name { font-size: 17.5px; }
    .why { font-size: 14px; }
    .tip { font-size: 13px; }
    .thumb {
      width: 62px;
      min-height: 62px;
      font-size: 25px;
    }
    .card { grid-template-columns: 62px minmax(0, 1fr); column-gap: 10px; }
    .card { padding: 12px 11px; }
    .cat { padding: 0 4px; font-size: 13px; min-height: 38px; }
    .shell { grid-template-columns: 78px minmax(0, 1fr); column-gap: 7px; padding: 0 8px; }
    .bar-count { font-size: 22px; }
    .bar { left: 8px; right: 8px; }
    .list { padding: 0 0 140px; }
    /* 弹层标题在 320 屏会折成两行，改成上下排 */
    .sheet-head {
      flex-direction: column;
      align-items: flex-start;
      gap: 3px;
      padding: 9px 16px 8px;
    }
    .sheet-title { font-size: 18.5px; line-height: 1.35; }
    .sheet-sub { font-size: 12.5px; }
    .sheet-body { padding: 0 12px 6px; }
    .adv { padding: 10px 11px; }
    .adv-text { font-size: 14px; }
    .btn { font-size: 15.5px; padding: 13px 8px; }
    .sheet-foot { padding: 10px 12px 16px; }
  }

  /* 9. 横屏（手机横过来）：弹层不超过屏幕，别把标题挤没 */
  @media (max-height: 430px) and (orientation: landscape) {
    .sheet { max-height: 94vh; max-height: 94dvh; }
    .hero { padding-top: calc(14px + env(safe-area-inset-top)); padding-bottom: 10px; }
  }
</style>
</head>

<script>

// ============================================================
// 搭配评价
// 四个约束：低钠（血压）+ 低饱和脂肪（血脂）+ 低嘌呤（尿酸）+ 不刺激胃（反流/胃炎）
// 只做"生活方式提示"，不做任何病症判断
// ============================================================

function evaluate(selected) {
  if (!selected || selected.length === 0) {
    return { tone: 'empty', headline: '还没选菜', items: [] }
  }

  const items = []

  const staple = selected.filter(d => d.cat === 'staple')
  const soups = selected.filter(d => d.cat === 'soup')
  const greenVeg = selected.filter(d => d.flags && d.flags.greenVeg)
  const protein = selected.filter(d => d.flags && d.flags.protein)
  const dairy = selected.filter(d => d.flags && d.flags.dairy)
  const highSodium = selected.filter(d => d.flags && d.flags.highSodium)
  const highPurine = selected.filter(d => d.flags && d.flags.highPurine)
  const fried = selected.filter(d => d.flags && d.flags.fried)
  const oldSoup = selected.filter(d => d.flags && d.flags.oldSoup)
  const avoidDishes = selected.filter(d => d.avoid)
  const level2 = selected.filter(d => d.level === 2)
  const meats = selected.filter(d =>
    ['pork', 'chicken', 'fish', 'beef'].indexOf(d.cat) > -1)
  const stomach = selected.filter(d => d.flags && d.flags.stomach)
  const gentle = selected.filter(d => d.flags && d.flags.gentle)

  // ---------------- 加分项 ----------------
  if (greenVeg.length > 0) {
    items.push({
      type: 'ok',
      text: `有绿叶菜（${greenVeg.map(d => d.name).join('、')}），钾和纤维到位，蔬菜嘌呤低可以放心吃`
    })
  } else {
    items.push({
      type: 'warn',
      text: '这一顿没有绿叶菜，缺钾和纤维。加一道白灼菜心或炒芥兰就补上了，蔬菜不占嘌呤额度'
    })
  }

  if (protein.length > 0) {
    const names = protein.map(d => d.name)
    items.push({
      type: 'ok',
      text: `有优质蛋白（${names.slice(0, 3).join('、')}${names.length > 3 ? ' 等' : ''}）`
    })
  } else {
    items.push({
      type: 'warn',
      text: '没有蛋白质。加个蒸水蛋或一杯低脂奶——这两样嘌呤几乎为零，是最安全的蛋白'
    })
  }

  // 已经有蛋白但没乳制品时，才单独提醒加奶；完全没蛋白时上面那条已经提过了
  if (protein.length > 0 && dairy.length === 0) {
    items.push({
      type: 'ok',
      text: '建议今天加一杯低脂奶（300 毫升）——乳制品嘌呤几乎为零，还能帮着把尿酸排出去'
    })
  }

  if (staple.length === 0) {
    items.push({
      type: 'warn',
      text: '还没选主食。主食别省，换法比减量重要：白米里掺一点小米，比纯白米扛饿，又比糙米、玉米碴温和'
    })
  }

  // ---------------- 减分项 ----------------
  if (oldSoup.length > 0) {
    items.push({
      type: 'bad',
      text: '老火汤是这整套菜单里最该改的一样。嘌呤特别容易溶进水里，煲两小时的汤，嘌呤比吃肉还高'
    })
  }

  if (avoidDishes.length > 0) {
    // 老火汤已有专门提示，这里不重复列
    const rest = avoidDishes.filter(d => !(d.flags && d.flags.oldSoup))
    if (rest.length > 0) {
      const names = rest.map(d => d.name)
      const shown = names.length > 2
        ? names.slice(0, 2).join('、') + ` 等 ${names.length} 样`
        : names.join('、')
      items.push({
        type: 'bad',
        text: `「${shown}」属于要避开的。这几样对血压或尿酸是明确的坑，不是"少吃"能解决的`
      })
    }
  }

  // 已标"尽量避开"的菜不再单独提嘌呤，避免重复啰嗦
  const purineActive = highPurine.filter(d => !d.avoid)
  if (purineActive.length >= 2) {
    const names = purineActive.map(d => d.name)
    items.push({
      type: 'bad',
      text: `嘌呤偏高的有 ${purineActive.length} 道（${names.slice(0, 2).join('、')}${names.length > 2 ? ' 等' : ''}）。今天其他菜别再放肉汤、虾皮、紫菜`
    })
  } else if (purineActive.length === 1) {
    items.push({
      type: 'warn',
      text: `「${purineActive[0].name}」嘌呤偏高，这顿吃了它，另外的菜就别再放肉汤或海鲜`
    })
  }

  if (soups.length >= 2) {
    items.push({
      type: 'warn',
      text: `汤有两道（${soups.map(d => d.name).join('、')}），一天钠容易超，而且汤水撑大胃最容易反酸。汤只喝小半碗，别当水喝`
    })
  }

  // ---------------- 胃：反流 + 胃炎 ----------------
  if (stomach.length >= 3) {
    const names = stomach.map(d => d.name)
    items.push({
      type: 'warn',
      text: `有 ${stomach.length} 道对胃不太友好（${names.slice(0, 3).join('、')}${names.length > 3 ? ' 等' : ''}）。番茄偏酸、苦瓜偏寒、菌菇和芹菜容易胀。胃不舒服就挑一道留下，其他换成蒸水蛋、蒸鱼、山药这类`
    })
  } else if (stomach.length > 0 && gentle.length === 0 && selected.length >= 4) {
    items.push({
      type: 'warn',
      text: '这顿偏"硬"。加一道山药、蒸南瓜或小米粥，胃里会舒服很多'
    })
  }

  // 汤水的喝法，只要选了汤就提醒一次
  if (soups.length > 0 && soups.length < 2) {
    items.push({
      type: 'ok',
      text: '汤放温再喝、只喝小半碗。烫的和大量的汤水都容易反酸，这两件事比"喝什么汤"更关键'
    })
  }

  // 肉的总量：这是三高里最容易失控的一项，比"哪道菜"重要
  if (meats.length >= 4) {
    items.push({
      type: 'warn',
      text: `肉选了 ${meats.length} 道，一顿一两道就够（每道约 50 克生肉，半个手掌大）。多的那几道留着明天做`
    })
  }

  if (level2.length >= 3) {
    items.push({
      type: 'warn',
      text: `「看做法」的菜选了 ${level2.length} 道，有点多，挑一两道留到明天`
    })
  }

  if (fried.length > 0) {
    items.push({
      type: 'bad',
      text: '有过油的菜。今天炒菜全部改蒸、煮、白灼，油一天别超过 3 白瓷勺'
    })
  }

  if (highSodium.length >= 2) {
    items.push({
      type: 'bad',
      text: '高钠的菜两样以上了。今天所有菜都别再放盐和酱油'
    })
  }

  const bad = items.filter(i => i.type === 'bad').length
  const warn = items.filter(i => i.type === 'warn').length

  let tone = 'good'
  let headline = '这顿配得不错'
  if (bad > 0) {
    tone = 'bad'
    headline = '这顿有点冒险'
  } else if (warn > 0) {
    tone = 'warn'
    headline = '这顿还行，有两点要注意'
  }

  return { tone, headline, items }
}

<script>
(function () {
  'use strict';

  if (!window.DISH || !window.ADV || !window.EXTRA) {
    document.getElementById('list').innerHTML =
      '<div class="loading">菜单没加载出来<br>请检查网络后刷新页面</div>';
    return;
  }

  var DISHES = window.DISH.DISHES;
  var CATS = window.DISH.CATS;
  var LEVELS = window.DISH.LEVELS;
  var evaluate = window.ADV.evaluate;
  var DAILY_TIPS = window.ADV.DAILY_TIPS;
  var EXT = window.EXTRA;

  // ---------- 本地保存：今天选的，明天打开自动清空 ----------
  var STORE_KEY = 'mama-menu-v1';
  var todayKey = (function () {
    var d = new Date();
    return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
  })();

  var state = { cat: null, ids: loadIds() };

  function loadIds() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return [];
      var obj = JSON.parse(raw);
      if (obj.date !== todayKey) return [];
      var valid = DISHES.filter(function (x) { return obj.ids.indexOf(x.id) > -1; });
      return valid.map(function (x) { return x.id; });
    } catch (e) {
      return [];
    }
  }

  function saveIds() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({ date: todayKey, ids: state.ids }));
    } catch (e) {}
  }

  // ---------- 日期 ----------
  var d = new Date();
  var week = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  document.getElementById('today').textContent =
    (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日 · ' + week[d.getDay()];

  // ---------- 分类 ----------
  // 左侧竖条：一条从上排到底，顺序由 NAV_ORDER 决定
  //   身体那几件事 → 各类菜 → 水果/当季菜
  function renderCats() {
    var box = document.getElementById('cats');
    box.innerHTML = '';

    // key → 显示名。非菜入口用 EXTRA_LABEL，菜用 CATS 里的 label，只维护一处
    var LABEL = {};
    Object.keys(EXTRA_LABEL).forEach(function (k) { LABEL[k] = EXTRA_LABEL[k]; });
    CATS.forEach(function (c) { LABEL[c.key] = c.label; });

    NAV_ORDER.forEach(function (key) {
      if (!LABEL[key]) return;   // 这一项数据里已经没有了，跳过
      var el = document.createElement('button');
      el.type = 'button';
      el.className = 'cat' + (isExtra(key) ? ' cat-x' : '') + (state.cat === key ? ' on' : '');
      el.textContent = LABEL[key];
      el.onclick = function () {
        state.cat = key;
        renderCats();
        renderList();
        // 换分类回到顶部，别停在上一类的半截位置
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };
      box.appendChild(el);
    });
  }

  // ---------- 列表（按食材分组）----------
  function renderList() {
    var box = document.getElementById('list');
    box.innerHTML = '';

    if (isExtra(state.cat)) {
      document.getElementById('bar').style.display = 'none';
      document.querySelector('.legend').style.display = 'none';
      box.innerHTML = extraHtml(state.cat);
      return;
    }
    document.getElementById('bar').style.display = '';
    document.querySelector('.legend').style.display = '';

    var grid = document.createElement('div');
    grid.className = 'grid';
    box.appendChild(grid);

    CATS.forEach(function (c) {
      if (state.cat !== c.key) return;

      var items = DISHES.filter(function (x) { return x.cat === c.key; })
        .sort(function (a, b) { return a.level - b.level; });

      items.forEach(function (x) {
        grid.appendChild(buildTile(x));
      });
    });
  }

  // 一级页的一张卡：只有图和菜名。点图进详情，点右下角圆钮直接加入这顿
  function buildTile(x) {
    var on = state.ids.indexOf(x.id) > -1;

    var tile = document.createElement('div');
    tile.className = 'tile' + (on ? ' on' : '');
    tile.setAttribute('role', 'button');
    tile.setAttribute('aria-pressed', on ? 'true' : 'false');
    tile.setAttribute('data-id', x.id);

    var fig = document.createElement('div');
    fig.className = 'tile-fig';
    // emoji 垫底，照片盖上去；照片没出来就露 emoji
    fig.textContent = x.emoji;
    var im = document.createElement('img');
    im.src = 'images/final/' + x.id + '.webp';
    im.alt = x.name;
    im.loading = 'lazy';
    im.decoding = 'async';
    im.onerror = function () { im.style.display = 'none'; };
    fig.appendChild(im);

    // 左上角等级色点：绿=放心吃 黄=看做法 红=少吃
    var dot = document.createElement('span');
    dot.className = 'tile-dot d' + x.level;
    dot.title = LEVELS[x.level].text;
    fig.appendChild(dot);

    var add = document.createElement('button');
    add.type = 'button';
    add.className = 'tile-add';
    add.textContent = on ? '\u2713' : '+';
    add.setAttribute('aria-label', on ? '取消这道' : '加入这道');
    add.onclick = function (e) {
      e.stopPropagation();
      toggleId(x.id);
    };
    fig.appendChild(add);

    var name = document.createElement('div');
    name.className = 'tile-n';
    name.textContent = x.name;

    tile.appendChild(fig);
    tile.appendChild(name);
    tile.onclick = function () { openDetail(x.id); };

    return tile;
  }

  // 只更新这一张卡的状态，不整页重排，免得滚动位置跳掉
  function syncTile(id) {
    var el = document.querySelector('.tile[data-id="' + id + '"]');
    if (!el) return;
    var on = state.ids.indexOf(id) > -1;
    el.className = 'tile' + (on ? ' on' : '');
    el.setAttribute('aria-pressed', on ? 'true' : 'false');
    var a = el.querySelector('.tile-add');
    if (a) {
      a.textContent = on ? '\u2713' : '+';
      a.setAttribute('aria-label', on ? '取消这道' : '加入这道');
    }
  }

  function toggleId(id) {
    var i = state.ids.indexOf(id);
    if (i > -1) state.ids.splice(i, 1);
    else state.ids.push(id);
    saveIds();
    renderBar();
    syncTile(id);
    syncDtBtn();
    if (sheetOpen) renderAdvice();
  }

  // ---------- 二级页：详情 ----------
  var dtId = null;

  function openDetail(id) {
    var x = null;
    DISHES.forEach(function (d) { if (d.id === id) x = d; });
    if (!x) return;

    dtId = id;
    document.getElementById('dtCrumb').textContent = x.name;
    document.getElementById('dtName').textContent = x.name;

    var fig = document.getElementById('dtFig');
    fig.innerHTML = '';
    var im = new Image();
    im.src = 'images/final/' + x.id + '.webp';
    im.alt = x.name;
    im.onerror = function () { im.style.display = 'none'; };
    fig.appendChild(im);

    var catLabel = '';
    CATS.forEach(function (c) { if (c.key === x.cat) catLabel = c.label; });
    var meta = document.getElementById('dtMeta');
    meta.innerHTML =
      '<span class="badge b' + x.level + '">' + LEVELS[x.level].text + '</span>' +
      (catLabel ? '<span class="dt-cat">' + catLabel + '</span>' : '') +
      (x.ings && x.ings.length ? '<span class="dt-cat">' + x.ings.join('、') + '</span>' : '');

    document.getElementById('dtWhy').textContent = x.why;
    document.getElementById('dtTip').textContent = x.tip;
    syncDtBtn();

    var dt = document.getElementById('dt');
    dt.className = 'dt on';
    dt.scrollTop = 0;
    document.body.style.overflow = 'hidden';
    try { history.pushState({ dt: 1 }, ''); } catch (e) {}
  }

  function syncDtBtn() {
    var btn = document.getElementById('dtAdd');
    if (!btn) return;
    var on = dtId && state.ids.indexOf(dtId) > -1;
    btn.textContent = on ? '\u2713 已在这顿里，点此移除' : '加入这顿';
    btn.className = 'dt-btn' + (on ? ' on' : '');
  }

  function closeDetail(fromPop) {
    if (!dtId) return;
    document.getElementById('dt').className = 'dt';
    document.body.style.overflow = '';
    dtId = null;
    if (!fromPop) {
      try { history.back(); } catch (e) {}
    }
  }

  window.addEventListener('popstate', function () {
    if (dtId) closeDetail(true);
  });

  function renderBar() {
    var bar = document.getElementById('bar');
    document.getElementById('count').textContent = state.ids.length;
    bar.className = 'bar' + (state.ids.length ? ' on' : '');
  }

  // ============================================================
  // 随便配一桌
  // ------------------------------------------------------------
  // 规则全部集中在 PAIR 里，页面别处不再写死分类名。
  // 以后加菜：只要 data/dishes.js 里新菜有 cat（对应 CATS 里有 role）和 ings，
  // 它就自动进搭配池；改这里的数字就能变成「两菜一汤」「四菜一汤」。
  // ============================================================
  var PAIR = {
    dishes: 3,        // 几道菜（不含汤）
    soups: 1,         // 几道汤
    maxLv2: 1,        // 一桌最多几道「看做法」
    maxPerCat: 1,     // 同一分类最多几道（挡住"三道都是猪肉"）
    roles: {          // 每种角色的数量上下限，保证有荤有素
      meat: { min: 1, max: 2 },
      veg:  { min: 1, max: 2 },
      egg:  { min: 0, max: 1 }
    },
    noRepeatIng: true, // 同桌不重样（不会两道冬瓜、两道木耳）
    tries: 80
  };

  // 分类 → 角色。CATS 里没写 role 的分类不参与配桌（照样在分类条里显示）
  var ROLE_OF = {};
  CATS.forEach(function (c) { if (c.role) ROLE_OF[c.key] = c.role; });

  // 按角色分池。主食不进池子——它不属于"这几道菜"，是另外加的
  var POOL = {};
  DISHES.forEach(function (x) {
    var r = ROLE_OF[x.cat];
    if (!r || r === 'staple') return;
    (POOL[r] = POOL[r] || []).push(x);
  });

  var ROLE_LABEL = { meat: '荤', veg: '素', egg: '蛋豆', soup: '汤' };

  function randOf(a) { return a[Math.floor(Math.random() * a.length)]; }

  // 这道菜能不能进这一桌
  function clashes(x, chosen) {
    var sameCat = 0;
    for (var i = 0; i < chosen.length; i++) {
      if (chosen[i].id === x.id) return true;
      if (chosen[i].cat === x.cat) sameCat++;
    }
    if (sameCat >= PAIR.maxPerCat) return true;
    if (PAIR.noRepeatIng) {
      var used = {};
      chosen.forEach(function (c) {
        (c.ings || []).forEach(function (k) { used[k] = 1; });
      });
      var dup = (x.ings || []).some(function (k) { return used[k]; });
      if (dup) return true;
    }
    return false;
  }

  function pickFor(role, chosen) {
    var pool = POOL[role] || [];
    var free = pool.filter(function (x) { return !clashes(x, chosen); });
    if (!free.length) return null;
    var lv2Used = chosen.filter(function (x) { return x.level === 2; }).length;
    var lv1 = free.filter(function (x) { return x.level === 1; });
    var lv2 = free.filter(function (x) { return x.level === 2; });
    // 八成给「放心吃」；偶尔掺一道「看做法」，但不超过上限
    if (lv2.length && lv2Used < PAIR.maxLv2 && (!lv1.length || Math.random() < 0.2)) {
      return randOf(lv2);
    }
    return randOf(lv1.length ? lv1 : free);
  }

  // 先排角色：固定一荤一素，剩下的位置随机，但不超过角色上限
  function rolePlan() {
    var plan = ['meat', 'veg'];
    for (var i = plan.length; i < PAIR.dishes; i++) {
      var cand = ['egg', 'meat', 'veg'].filter(function (r) {
        var n = plan.filter(function (p) { return p === r; }).length;
        var cap = PAIR.roles[r] ? PAIR.roles[r].max : 1;
        return n < cap;
      });
      plan.push(cand.length ? randOf(cand) : 'veg');
    }
    return plan;
  }

  function makeSet() {
    for (var t = 0; t < PAIR.tries; t++) {
      var chosen = [];
      var plan = rolePlan();
      var ok = true;
      for (var s = 0; s < PAIR.soups && ok; s++) {
        var sp = pickFor('soup', chosen);
        if (!sp) ok = false; else chosen.push(sp);
      }
      for (var i = 0; i < plan.length && ok; i++) {
        var dd = pickFor(plan[i], chosen);
        if (!dd) ok = false; else chosen.push(dd);
      }
      if (!ok) continue;
      var lv2n = chosen.filter(function (x) { return x.level === 2; }).length;
      if (lv2n > PAIR.maxLv2) continue;
      return chosen;
    }
    return null;
  }

  var pairSet = null;

  function pairRow(x) {
    var role = ROLE_OF[x.cat];
    var catLabel = '';
    CATS.forEach(function (c) { if (c.key === x.cat) catLabel = c.label; });
    var lv = x.level === 1 ? '<span class="pair-lv lv1">放心吃</span>'
                           : '<span class="pair-lv lv2">看做法</span>';
    return '<div class="pair-row" data-pair="' + x.id + '">' +
      '<img class="pair-img" src="images/final/' + x.id + '.webp" alt="' + x.name + '" ' +
        'loading="lazy" decoding="async" ' +
        "onerror=\"this.style.visibility='hidden'\">" +
      '<div>' +
        '<div class="pair-n">' + x.name + lv + '</div>' +
        '<div class="pair-meta"><span class="pair-tag t-' + role + '">' +
          (ROLE_LABEL[role] || '菜') + '</span>' +
          // 只有荤菜需要点明是猪/鸡/鱼，素和汤再写分类就是重复
          (role === 'meat' && catLabel ? catLabel + ' · ' : '') +
          (x.ings && x.ings.length ? x.ings.join('、') : '') + '</div>' +
      '</div></div>';
  }

  function renderPair() {
    pairSet = makeSet();
    var box = document.getElementById('pairBody');
    var sub = document.getElementById('pairSub');

    if (!pairSet) {
      sub.textContent = '';
      box.innerHTML = '<div class="pair-note">这道菜池子不够配不出来了，' +
        '先去菜单里自己点几道吧。</div>';
      return;
    }

    var soup = [], dish = [];
    pairSet.forEach(function (x) {
      (ROLE_OF[x.cat] === 'soup' ? soup : dish).push(x);
    });

    // 荤的先上、素的跟着、汤最后
    var order = { meat: 0, egg: 1, veg: 2, soup: 3 };
    dish.sort(function (a, b) {
      return (order[ROLE_OF[a.cat]] || 9) - (order[ROLE_OF[b.cat]] || 9);
    });

    var n = { meat: 0, veg: 0, egg: 0 };
    dish.forEach(function (x) { n[ROLE_OF[x.cat]] = (n[ROLE_OF[x.cat]] || 0) + 1; });

    var said = [];
    if (n.meat) said.push(n.meat + ' 道荤');
    if (n.veg) said.push(n.veg + ' 道素');
    if (n.egg) said.push(n.egg + ' 道蛋豆');
    if (soup.length) said.push(soup.length + ' 道汤');

    var lv2n = pairSet.filter(function (x) { return x.level === 2; }).length;

    sub.textContent = dish.length + ' 菜 ' + soup.length + ' 汤';
    var html = '<div class="pair-note">荤素搭着来：' + said.join('、') +
      '。同一桌不会出现两道同一种食材，也不会整桌青菜。' +
      (lv2n ? '其中 ' + lv2n + ' 道写着「看做法」，做的时候按步骤来。' :
              '都是「放心吃」的，照常做就行。') +
      '</div>';
    dish.forEach(function (x) { html += pairRow(x); });
    soup.forEach(function (x) { html += pairRow(x); });
    box.innerHTML = html;
  }

  // ---------- 面板 ----------
  var sheetOpen = false;

  function picked() {
    return DISHES.filter(function (x) {
      return state.ids.indexOf(x.id) > -1;
    });
  }

  function renderAdvice() {
    var r = evaluate(picked());
    document.getElementById('headline').textContent = r.headline;
    document.getElementById('subline').textContent =
      state.ids.length ? '已选 ' + state.ids.length + ' 道' : '';

    var box = document.getElementById('advice');
    var html = '';

    r.items.forEach(function (it) {
      var icon = it.type === 'ok' ? '✓' : (it.type === 'warn' ? '!' : '✕');
      var cls = it.type === 'ok' ? 'aok' : (it.type === 'warn' ? 'awarn' : 'abad');
      html += '<div class="adv ' + cls + '"><div class="adv-icon">' + icon +
              '</div><div class="adv-text"></div></div>';
    });

    html += '<div class="tips"><span class="tips-title">每天的口径</span>';
    DAILY_TIPS.forEach(function () {
      html += '<div class="tips-row"><span class="tips-dot"></span><span></span></div>';
    });
    html += '</div>';

    box.innerHTML = html;

    var texts = box.querySelectorAll('.adv-text');
    r.items.forEach(function (it, i) { texts[i].textContent = it.text; });

    var rows = box.querySelectorAll('.tips-row span:last-child');
    DAILY_TIPS.forEach(function (t, i) { rows[i].textContent = t; });
  }

  function openSheet() {
    sheetOpen = true;
    renderAdvice();
    document.getElementById('mask').className = 'mask on';
    document.getElementById('sheet').className = 'sheet on';
  }

  function closeSheet() {
    sheetOpen = false;
    document.getElementById('mask').className = 'mask';
    document.getElementById('sheet').className = 'sheet';
  }

  document.getElementById('openBtn').onclick = openSheet;
  document.getElementById('closeBtn').onclick = closeSheet;
  document.getElementById('clearBtn').onclick = function () {
    state.ids = [];
    saveIds();
    renderList();
    renderBar();
    closeSheet();
  };

  // ---------- 分类导航 ----------
  // 非菜入口：这几块不是菜，是页面里的另外几块内容
  var EXTRA_LABEL = {
    'x-stomach': '🩺 养胃',
    'x-tea':     '🍵 喝什么',
    'x-body':    '⚖️ 体重',
    'x-fruit':   '🍇 水果',
    'x-season':  '🥬 当季菜'
  };

  // 左侧竖条从上到下的顺序，改这三个数组就能调整
  var NAV_DISH  = ['pork', 'chicken', 'fish', 'beef', 'egg', 'veg', 'soup', 'staple'];  // 各类菜
  var NAV_EXTRA = ['x-fruit', 'x-season'];                                        // 水果、当季菜
  var NAV_BODY  = ['x-stomach', 'x-tea', 'x-body'];                              // 身体那几件事，放最后
  var NAV_ORDER = NAV_DISH.concat(NAV_EXTRA, NAV_BODY);

  // 数据里新加了分类、但上面三个数组都没写：自动补到最后，不会丢
  (function () {
    var known = {};
    NAV_ORDER.forEach(function (k) { known[k] = 1; });
    CATS.forEach(function (c) {
      if (!known[c.key]) { NAV_ORDER.push(c.key); known[c.key] = 1; }
    });
  })();

  // 没有「全部」之后，默认落在第一个有菜的普通分类上。
  // 数据里改了分类顺序、或者加了新分类，这里会自动跟着变，不用改代码。
  function defaultCat() {
    for (var i = 0; i < NAV_ORDER.length; i++) {
      var k = NAV_ORDER[i];
      if (isExtra(k)) continue;
      if (DISHES.some(function (x) { return x.cat === k; })) return k;
    }
    return NAV_ORDER[0];
  }

  function isExtra(key) {
    return key.indexOf('x-') === 0;
  }

  function sec(title, sub) {
    return '<div class="sec"><span class="sec-t">' + title + '</span>' +
           (sub ? '<span class="sec-s">' + sub + '</span>' : '') + '</div>';
  }

  function item(x) {
    var fig = '';
    if (x.id) {
      fig = '<div class="ei-fig">' +
            '<img src="images/final/' + x.id + '.webp" alt="' + x.name + '" ' +
            'loading="lazy" decoding="async" ' +
            "onerror=\"this.parentNode.style.display='none'\">" +
            '</div>';
    }
    return '<div class="ei ei-' + x.tone + (x.id ? ' has-img' : '') + '">' +
           fig +
           '<div class="ei-bd">' +
           '<div class="ei-n">' + x.name + '</div>' +
           '<div class="ei-t">' + x.text + '</div></div></div>';
  }

  function extraHtml(key) {
    var h = '';

    if (key === 'x-stomach') {
      h += '<div class="x-lead">反流加胃炎，要改的其实不是"吃什么菜"，是<b>怎么吃</b>。' +
           '下面这几条比换菜管用得多。</div>';
      EXT.STOMACH.lines.forEach(function (x) { h += item(x); });
    }

    if (key === 'x-tea') {
      h += '<div class="x-lead">家里这几样花草，哪些能天天喝、哪些只是偶尔。' +
           '<b>所有茶都不加糖、不加蜂蜜。</b></div>';
      EXT.TEAS.forEach(function (x) { h += item(x); });
    }

    if (key === 'x-fruit') {
      h += '<div class="x-lead">水果按<b>果糖</b>排，不按甜不甜排。一天 200–350 克，分两次吃。</div>';
      EXT.FRUIT.forEach(function (x) { h += item(x); });
      // 柚子别吃、不空腹不冰：两句最要紧的，压短了放最后
      EXT.FRUIT_TAIL.forEach(function (x) { h += item(x); });
    }

    if (key === 'x-season') {
      h += '<div class="x-lead">广东 10 月底到 11 月，这几样在田里产量最大，' +
           '又便宜又嫩。<b>买菜照着这几样挑就行。</b></div>';
      EXT.SEASON_VEG.forEach(function (x) { h += item(x); });
    }

    if (key === 'x-body') {
      h += '<div class="x-lead">这项最划算：体重每减 1 公斤，收缩压大约降 1 毫米汞柱。' +
           '关键是<b>不饿肚子</b>，吃饱了才减得下去。</div>';
      h += '<div class="body-card">' +
           '<div class="bc-row"><span class="bc-k">现在</span><span class="bc-v">' + EXT.BODY.now + '</span></div>' +
           '<div class="bc-row"><span class="bc-k">体型</span><span class="bc-v"><span class="hot">' + EXT.BODY.bmi + '</span></span></div>' +
           '<div class="bc-row"><span class="bc-k">目标</span><span class="bc-v">' + EXT.BODY.target + '</span></div>' +
           '</div>';
      EXT.BODY.lines.forEach(function (x) { h += item(x); });
    }

    return h;
  }

  function closeAll() {
    closeSheet();
    document.getElementById('pairSheet').className = 'sheet';
    document.getElementById('mask').className = 'mask';
  }

  document.getElementById('mask').onclick = closeAll;

  document.getElementById('dtBack').onclick = function () { closeDetail(false); };
  document.getElementById('dtAdd').onclick = function () { if (dtId) toggleId(dtId); };

  document.getElementById('pickBtn').onclick = function () {
    renderPair();
    document.getElementById('mask').className = 'mask on';
    document.getElementById('pairSheet').className = 'sheet on';
  };

  document.getElementById('pairAgain').onclick = renderPair;

  document.getElementById('pairTake').onclick = function () {
    if (!pairSet) { closeAll(); return; }
    state.ids = pairSet.map(function (x) { return x.id; });
    saveIds();
    renderList();
    renderBar();
    // 没有「全部」页了：收下这桌就直接给结论，不用再翻列表
    document.getElementById('pairSheet').className = 'sheet';
    openSheet();
  };


  if (!state.cat) state.cat = defaultCat();
  renderCats();
  renderList();
  renderBar();
})();
</script>
</body>
</html>
